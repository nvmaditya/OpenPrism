[project]
name = "prismtex"
version = "0.1.0.dev0"
description = "A self-hosted LaTeX workspace with an AI agent that shows its work"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.7",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "anthropic>=0.120,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "pyright>=1.1.390",
]

[project.scripts]
prismtex = "prismtex.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prismtex = ["workspace/templates/**/*", "agent/data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# backend/ on sys.path, so tests import shared helpers as `tests.<path>` (no __init__.py).
pythonpath = ["."]
markers = [
  "tex: needs a real TeX installation (latexmk); fails, never skips, when TeX is missing",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
