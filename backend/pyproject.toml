[project]
name = "prism-backend"
version = "0.1.0"
description = "Prism LaTeX research agent backend (FastAPI + LangGraph)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "langchain-core>=0.3",
  "langgraph>=0.2",
  "langchain-openai>=0.2",
  "langchain-anthropic>=0.2",
  "pypdf>=5.0",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
prism-api = "app.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
