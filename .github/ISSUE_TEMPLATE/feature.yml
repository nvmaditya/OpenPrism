name: Feature request
description: Suggest an idea, or ask a question the docs don't answer.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check [ROADMAP.md](https://github.com/nvmaditya/OpenPrism/blob/main/ROADMAP.md) first: your idea may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: Problem or question
      description: What you are trying to do, and what gets in the way. Describe the need before the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How you picture it working. Leave it empty for a question.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use today, or other approaches you considered.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and the roadmap.
          required: true
